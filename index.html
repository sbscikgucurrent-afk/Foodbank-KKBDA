<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <title>JOM KENYANG - Pelancar Sistem</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-h: 100vh;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1.5rem;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 90%;
    }
    h1 {
      color: #34d399;
      margin-top: 0;
      font-size: 1.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #059669;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #047857;
    }
    .badge {
      display: inline-block;
      background: #d97706;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">KOLEJ KOMUNITI BANDAR DARULAMAN</div>
    <h1>JOM KENYANG</h1>
    <p>Sistem Pengurusan Jom Kenyang — Dapur Siswa (Next.js App Server).</p>
    <p>Membuka portal di <strong>http://localhost:3000</strong>...</p>
    <a href="http://localhost:3000/" class="btn">Buka Sistem Secara Manual</a>
  </div>
</body>
</html>
